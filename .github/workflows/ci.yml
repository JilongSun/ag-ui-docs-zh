name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch pinned upstream docs
        run: node scripts/fetch-upstream.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Structural parity, code fidelity, callouts
        run: node scripts/check-parity.mjs
      - name: Links and anchors
        run: node scripts/check-links.mjs
      - name: Terminology and identifiers
        run: node scripts/check-terms.mjs
      - name: Translation coverage
        run: node scripts/check-coverage.mjs
