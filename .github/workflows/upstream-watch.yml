name: upstream-watch

on:
  schedule:
    # 每周一 01:00 UTC（北京时间 09:00）
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      head:
        description: "对比到的上游 ref（留空则用 main）"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

env:
  TITLE: 上游文档变更待处理

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 找到跟踪 issue，读取上次报告位置
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUM=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          echo "number=$NUM" >> "$GITHUB_OUTPUT"
          if [ -z "$NUM" ]; then
            echo "since=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BODY=$(gh issue view "$NUM" --json body --jq .body)
          SINCE=$(printf '%s' "$BODY" \
            | sed -n 's/.*watch:head=\([0-9a-f]\{7,40\}\).*/\1/p' | head -1)
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"

      - name: 对比基线与上游
        id: watch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_INPUT: ${{ inputs.head }}
          SINCE: ${{ steps.issue.outputs.since }}
        run: |
          ARGS=""
          if [ -n "$HEAD_INPUT" ]; then ARGS="$ARGS --head $HEAD_INPUT"; fi
          if [ -n "$SINCE" ]; then ARGS="$ARGS --since $SINCE"; fi
          node scripts/check-upstream-changes.mjs $ARGS

      - name: 写入运行摘要
        if: always() && hashFiles('sync-report.md') != ''
        run: cat sync-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 提交报告
        if: steps.watch.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.watch.outputs.head_sha }}
          NUM: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          printf '\n<!-- watch:head=%s -->\n' "$HEAD_SHA" >> sync-report.md
          if [ -z "$NUM" ]; then
            gh issue create --title "$TITLE" --body-file sync-report.md
            exit 0
          fi
          gh issue comment "$NUM" --body-file sync-report.md
          BODY=$(gh issue view "$NUM" --json body --jq .body)
          if printf '%s' "$BODY" | grep -q 'watch:head='; then
            NEW=$(printf '%s' "$BODY" | sed "s/watch:head=[0-9a-f]*/watch:head=$HEAD_SHA/")
          else
            NEW=$(printf '%s\n\n<!-- watch:head=%s -->' "$BODY" "$HEAD_SHA")
          fi
          gh issue edit "$NUM" --body "$NEW"
